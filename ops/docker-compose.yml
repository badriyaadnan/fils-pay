# Local development stack for FilsPay: Postgres + api + settlement + reporting,
# plus one-off migrate and seed jobs, plus the merchant dashboard (web).
# بيئة التشغيل: قاعدة البيانات + الـ API + التسويات + التقارير، ومهمتين
# تشتغلون مرة وحدة: migrate (بناء الجداول) وseed (بيانات تجريبية)، ولوحة التاجر.
#
# Run from the repo root / شغّليه من المجلد الرئيسي:
#   docker compose -f ops/docker-compose.yml up --build -d
#
# Fix: services now load ops/.env.docker (env_file) and wait until migrate
# has finished before starting.
# الإصلاح: الخدمات الحين تقرا ops/.env.docker، وتنتظر لين migrate يخلص
# قبل ما تبدأ.
#
# Deploy (Dilmune): long-running services have `restart: unless-stopped`, so
# if one crashes under load (or the server reboots) Docker starts it again.
# The judges put traffic through the server ("does it stay up").
# النشر: الخدمات الدايمة فيها restart: unless-stopped، يعني لو طاحت وحدة
# (أو السيرفر انعاد تشغيله)، Docker يرجّعها لحاله. الحكام بيضغطون السيرفر.
#
# Capacity: the api is limited to 0.5 vCPU / 512 MB (the hosting rule), Node's
# heap is capped below that so it never gets OOM-killed, and requests above
# API_MAX_IN_FLIGHT get a fast 503 instead of piling up (plugins/loadShedding.ts).
# القدرة: الـ api محدود بنص معالج و512 ميجا (شرط الاستضافة)، وذاكرة Node أقل
# من الحد عشان ما ينقتل، والطلبات الزايدة عن API_MAX_IN_FLIGHT تاخذ 503 بسرعة
# بدل ما تتكدس.
#
# Admin console: http://<server or localhost>:5174
# لوحة الإدارة: http://<السيرفر أو localhost>:5174

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filspay
      POSTGRES_PASSWORD: filspay_dev_password
      POSTGRES_DB: filspay
    # Only reachable from this machine, not the internet.
    # بس من نفس الجهاز، مو من الإنترنت (قاعدة البيانات ما تنفتح للعالم).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - filspay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Applies db/migrations/*.sql once, then exits.
  # يطبّق ملفات الـ migrations مرة وحدة ويطلع.
  migrate:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # Loads demo data. Runs after migrate.
  # يحط بيانات تجريبية. يشتغل بعد migrate.
  seed:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "seed"]
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
    # Fix: load the same env file as api. Without it the Dockerfile's
    # NODE_ENV=production applies and seed crashes asking for
    # SETTLEMENT_INTERNAL_TOKEN.
    # الإصلاح: نحمّل نفس ملف البيئة مثل الـ api. بدونه يصير
    # NODE_ENV=production (من الـ Dockerfile) والـ seed يطيح ويطلب
    # SETTLEMENT_INTERNAL_TOKEN.
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npx", "tsx", "apps/api/src/index.ts"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
      SETTLEMENT_INTERNAL_URL: http://settlement:8091
      # Tuned by load test (ops/loadtest): at 0.5 vCPU the API tops out around
      # 9-10 checkouts/s. Letting more requests in at once (run 2: pool 20,
      # 48 in flight) did not add throughput, it only made every request
      # slower. So we keep the work small and turn the rest away fast (503).
      # ضبطناها باختبار الضغط: بنص معالج الـ API يوصل تقريباً 9-10 دفعات بالثانية.
      # لما دخّلنا طلبات أكثر بنفس الوقت (المرة الثانية) ما زادت السرعة، بس كل
      # الطلبات بطت. فنخلي الشغل قليل ونرفض الزايد بسرعة (503).
      # Max requests in progress at once; more get 503 + Retry-After.
      # أقصى عدد طلبات بنفس اللحظة، والزايد ياخذ 503.
      API_MAX_IN_FLIGHT: "24"
      # DB connections. Payments hold one while waiting for the acquirer.
      # اتصالات قاعدة البيانات. الدفع يمسك اتصال وهو ينتظر البنك.
      PG_POOL_MAX: "10"
      # Keep Node's heap under the 512 MB limit. / ذاكرة Node أقل من حد 512.
      NODE_OPTIONS: "--max-old-space-size=384"
    env_file: .env.docker
    # Hosting rule: API limited to 0.5 vCPU and 512 MB.
    # شرط الاستضافة: الـ API بنص معالج و512 ميجا بالكثير.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    # Docker marks the api unhealthy if /healthz stops answering.
    # Docker يعرف إن الـ api مو صاحي لو /healthz وقف يرد.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  settlement:
    build:
      context: ..
      dockerfile: ops/Dockerfile.go
    command: ["./settlement", "daemon"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  reporting:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npx", "tsx", "apps/reporting/src/index.ts"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Merchant dashboard (UI) / لوحة التاجر (الواجهة)
  # Open / افتحي: http://<server or localhost>:5173/dashboard/login
  web:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    working_dir: /app/apps/web
    command: ["npx", "vite", "--config", "/app/ops/web-dev.vite.config.mjs"]
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # Empty = same address the page was opened from, so it works on
      # localhost AND on the server's IP (requests go through the /v1 proxy).
      # فاضي = نفس العنوان اللي انفتحت منه الصفحة، فيشتغل على localhost
      # وعلى IP السيرفر (الطلبات تمر من الـ proxy).
      VITE_API_BASE_URL: ""
    volumes:
      - ./web-dev.vite.config.mjs:/app/ops/web-dev.vite.config.mjs:ro
    ports:
      - "5173:5173"
    depends_on:
      - api

  # Admin console (UI) / لوحة الإدارة (الواجهة)
  # Open / افتحي: http://<server or localhost>:5174
  admin:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    working_dir: /app/apps/admin
    command: ["npx", "vite", "--config", "/app/ops/admin-dev.vite.config.mjs"]
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # Empty = same origin, through the /v1 proxy. / فاضي = نفس العنوان عن طريق الـ proxy.
      VITE_ADMIN_API_BASE_URL: ""
      # Where "view as merchant" links point. On the server set PUBLIC_WEB_URL.
      # وين يودّي رابط "عرض كتاجر". على السيرفر نحط PUBLIC_WEB_URL.
      VITE_WEB_BASE_URL: ${PUBLIC_WEB_URL:-http://localhost:5173}
    volumes:
      - ./admin-dev.vite.config.mjs:/app/ops/admin-dev.vite.config.mjs:ro
    ports:
      - "5174:5174"
    depends_on:
      - api

volumes:
  filspay_pgdata: